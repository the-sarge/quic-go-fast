name: R17 diagnostic only — NOT qualification

on:
  pull_request:
    types: [synchronize]
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - 'docs/**'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: multipath-interop-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnostic-only:
    if: ${{ github.event.pull_request.draft && github.head_ref == 'codex/r17-1037-qualification-20261109' }}
    # Native hosted amd64, independent of the shared qualification/performance host.
    runs-on: ubuntu-24.04
    # Temporary D1: one setup <=1200 s + one case <=150 s; no qualification.
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Bind exact source and execution venue
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RESULTS_DIR: ${{ runner.temp }}/multipath-interop
        run: |
          echo "RESULTS_DIR=$RESULTS_DIR" >> "$GITHUB_ENV"
          mkdir "$RESULTS_DIR"
          git rev-parse HEAD 'HEAD^{tree}' > "$RESULTS_DIR"/source.txt
          uname -a > "$RESULTS_DIR"/kernel.txt
          lscpu > "$RESULTS_DIR"/cpu.txt
          docker version > "$RESULTS_DIR"/docker-version.txt
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          Path(os.environ["RESULTS_DIR"], "runner.json").write_text(json.dumps({
              "system": platform.uname()._asdict(), "emulation": False,
              "runner": {key: os.environ.get(key) for key in ("RUNNER_OS", "RUNNER_ARCH", "RUNNER_NAME", "RUNNER_ENVIRONMENT", "ImageOS", "ImageVersion", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")},
          }, indent=2) + "\n")
          PY
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(uname -m)" = x86_64
      - name: Build the pinned independent peer once
        run: |
          timeout 1200s docker build --platform linux/amd64 -f interop/multipath/Dockerfile \
            --build-arg QGF_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            --build-arg QGF_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" \
            -t qgf-r17 . 2>&1 | tee "$RESULTS_DIR"/build.log
          docker image inspect qgf-r17 > "$RESULTS_DIR"/image-inspect.json
          test "$(docker image inspect qgf-r17 --format '{{.Architecture}}')" = amd64
          docker image inspect qgf-r17 --format '{{.Id}}' > "$RESULTS_DIR"/image-id.txt
          container=$(docker create --network none qgf-r17)
          trap 'docker rm -f "$container" > /dev/null' EXIT
          docker cp "$container:/src/build-packages.txt" "$RESULTS_DIR"/build-packages.txt
      - name: Diagnose one affected cell — NOT qualification
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["RESULTS_DIR"])
          (root / "diagnostic-not-qualification.json").write_text(json.dumps({
              "stage": "R17D1", "qualification": False,
              "candidate": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "image": (root / "image-id.txt").read_text().strip(),
              "expected": ["TestPicoquicMultipathMatrix/abandon-reopen-late-feedback/client"],
              "builds": 1, "zero_invocations": 0, "prior_runs": [42648012706, 42653036958],
              "bounds_seconds": {"build": 1200, "role": 30, "go": 90, "runner": 120, "container": 150},
              "source_sha256": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in (
                  "interop/multipath/peer.c", "interop/multipath/run.py", "interop/multipath/Dockerfile",
                  "multipath_picoquic_matrix_test.go", "multipath_picoquic_diagnostic_test.go")},
          }, indent=2) + "\n")
          PY
          image=$(cat "$RESULTS_DIR"/image-id.txt)
          container=
          current=
          cleanup() {
            if test -n "$container"; then
              docker inspect "$container" > "$current/container-inspect.json"
              docker rm -f "$container" > /dev/null
              container=
            fi
          }
          trap cleanup EXIT
          run_case() {
            relative=$1
            shift
            current="$RESULTS_DIR/$relative"
            mkdir -p "$current"
            # The runner owns a fresh child directory; outer logs survive a timeout.
            container=$(docker create --platform linux/amd64 --network none \
              --user "$(id -u):$(id -g)" \
              -e QGF_IMAGE_ID="$image" -e PYTHONDONTWRITEBYTECODE=1 \
              -e QGF_R17_DIAGNOSTIC=abandon-client-v1 \
              -e HOME=/tmp -e GOCACHE=/tmp/go-build -e GOPATH=/tmp/go \
              -v "$RESULTS_DIR:/results" "$image" \
              --binary /usr/local/bin/qgf-r17-peer --test-binary /src/peer-matrix.test \
              --output "/results/$relative/run" "$@")
            timeout 150s docker start --attach "$container" 2>&1 | tee "$current/container.log"
            test "$(docker inspect "$container" --format '{{.State.ExitCode}}')" = 0
            cleanup
            # Give the aggregate checker one canonical case directory.
            mv "$current/run/"* "$current/"
            rmdir "$current/run"
          }
          run_case diagnostic-abandon/client --matrix --scenario abandon-reopen-late-feedback --role client
      - name: Retain all attempts and raw peer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: r17-diagnostic-NOT-qualification-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/multipath-interop/
          if-no-files-found: error
          retention-days: 90
