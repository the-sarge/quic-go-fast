on: [push, pull_request]

permissions: read-all

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu", "windows", "macos" ]
        go: [ "1.26.x", "1.27.x" ]
    runs-on: ${{ fromJSON(vars[format('UNIT_RUNNER_{0}', matrix.os)] || format('"{0}-latest"', matrix.os)) }}
    name: Unit tests (${{ matrix.os}}, Go ${{ matrix.go }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go version
      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0
      - name: Test unit capture provenance
        run: python3 .github/scripts/test_unit_capture.py
      - name: Configure unit capture directory
        shell: bash
        run: echo "QUIC_GO_HTTP_CAPTURE_DIR=$RUNNER_TEMP/quic-go-unit" >> "$GITHUB_ENV"
      - name: Remove integrationtests
        shell: bash
        run: git rm -r --cached integrationtests && rm -rf integrationtests
      - name: Run tests
        env:
          TIMESCALE_FACTOR: 10
          # Temporary opt-in for #241, automatically rejected after its RFC3339 expiry.
          QUIC_GO_DIAL_OWNER_UNTIL: ${{ matrix.os == 'macos' && matrix.go == '1.27.x' && vars.QUIC_GO_DIAL_OWNER_UNTIL || '' }}
        run: python3 .github/scripts/http-capture.py --unit-source --label unit run -- go test -v -shuffle on -cover -coverprofile coverage.txt ./... 2>&1 | go-junit-report -set-exit-code -iocopy -out report.xml
      - name: Run tests as root
        if: ${{ matrix.os == 'ubuntu' }}
        env:
          TIMESCALE_FACTOR: 10
          FILE: sys_conn_helper_linux_test.go
        run: |
          test -f $FILE # make sure the file actually exists
          TEST_NAMES=$(grep '^func Test' "$FILE" | sed 's/^func \([A-Za-z0-9_]*\)(.*/\1/' | tr '\n' '|')
          go test -c -cover -tags root -o quic-go.test .
          sudo ./quic-go.test -test.v -test.run "${TEST_NAMES%|}" -test.coverprofile coverage-root.txt 2>&1 | go-junit-report -set-exit-code -iocopy -package-name github.com/quic-go/quic-go -out report_root.xml
          rm quic-go.test
      - name: Run tests with race detector
        if: ${{ matrix.os == 'ubuntu' }} # speed things up. Windows and OSX VMs are slow
        env:
          TIMESCALE_FACTOR: 20
        run: python3 .github/scripts/http-capture.py --unit-source --label race run -- go test -race -v -shuffle on ./...
      - name: Run handshake tests in FIPS140 mode
        env:
          GODEBUG: fips140=only
        run: go test -v ./internal/handshake -run 'TestToken|TestRetry|TestInitial|TestDecode|TestEncrypt'
      - name: Run benchmark tests
        run: go test -v -run=^$ -benchtime 0.5s -bench=. ./...
      - name: Checksum retained unit evidence
        if: always()
        run: python3 .github/scripts/http-capture.py finalize
      - name: Save unit failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-${{ matrix.os }}-go${{ matrix.go }}
          path: ${{ runner.temp }}/quic-go-unit/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          OS: ${{ matrix.os }}
          GO: ${{ matrix.go }}
        with:
          files: coverage.txt,coverage-root.txt
          env_vars: OS,GO
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          OS: ${{ matrix.os }}
          GO: ${{ matrix.go }}
        with:
          report_type: test_results
          name: Unit tests
          files: report.xml,report_root.xml
          env_vars: OS,GO
          token: ${{ secrets.CODECOV_TOKEN }}
