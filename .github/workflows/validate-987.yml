name: Bounded Windows fixture validation 987

on:
  push:
    branches: [codex/issue-987-tcp-reservation]

permissions: read-all

env:
  GOTOOLCHAIN: local
  TIMESCALE_FACTOR: 10

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[validate-987]')
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: false
      - name: Record pinned environment
        run: |
          git rev-parse HEAD
          go version
          test "$(go env GOTOOLCHAIN)" = local
          test "$(go env GOVERSION)" = go1.27.3
          python3 -c 'import os, platform; print(platform.platform()); print(platform.machine()); print("ImageOS=" + os.getenv("ImageOS", "")); print("ImageVersion=" + os.getenv("ImageVersion", ""))'
      - name: Focused test, at most 100 executions
        timeout-minutes: 5
        env:
          QUIC_GO_HTTP_CAPTURE_DIR: ${{ runner.temp }}/issue987/focused
        run: python3 .github/scripts/http-capture.py --label issue987-fix-focused run -- go test -v -count=100 -failfast -timeout=60s -run '^TestListenAndServeTLSStartupFailureReleasesUDP$' ./http3
      - name: Combined lifecycle tests, once
        timeout-minutes: 2
        env:
          QUIC_GO_HTTP_CAPTURE_DIR: ${{ runner.temp }}/issue987/combined
        run: python3 .github/scripts/http-capture.py --label issue987-fix-combined run -- go test -v -count=1 -timeout=2m -run '^TestListenAndServeTLS' ./http3
      - name: Captured HTTP3 shuffle order, once
        timeout-minutes: 5
        env:
          QUIC_GO_HTTP_CAPTURE_DIR: ${{ runner.temp }}/issue987/shuffle
        run: python3 .github/scripts/http-capture.py --label issue987-fix-shuffle run -- go test -v -count=1 -shuffle=1792692485838992000 -cover -coverprofile=coverage-http3.txt -timeout=5m ./http3
      - name: Original unit package scope, once
        timeout-minutes: 10
        env:
          QUIC_GO_HTTP_CAPTURE_DIR: ${{ runner.temp }}/issue987/unit
        run: |
          git rm -r --cached integrationtests
          rm -rf integrationtests
          python3 .github/scripts/http-capture.py --unit-source --label issue987-fix-unit run -- go test -v -count=1 -shuffle=on -cover -coverprofile=coverage.txt -timeout=10m ./...
      - name: Finalize retained evidence
        if: always()
        run: |
          for stage in focused combined shuffle unit; do
            QUIC_GO_HTTP_CAPTURE_DIR="$RUNNER_TEMP/issue987/$stage" python3 .github/scripts/http-capture.py finalize
          done
      - name: Retain bounded diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue987-fix-windows-go1.27.3
          path: ${{ runner.temp }}/issue987/
          if-no-files-found: warn
          retention-days: 14
