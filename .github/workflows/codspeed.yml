name: Benchmarks

permissions:
  contents: read
  id-token: write

# Disabled until a CodSpeed macro runner is registered for this fork: the
# upstream `codspeed-macro` runner is unavailable here, so automatic runs
# queue forever and leave a permanently pending "Benchmarks" check.
# Manual dispatch is kept so the workflow can be re-enabled later.
on:
  workflow_dispatch:

# Keep every command on the toolchain installed by setup-go.
env:
  GOTOOLCHAIN: local

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: codspeed-macro
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: false
      - name: Verify selected Go toolchain
        shell: bash
        run: |
          go version
          test "$(go env GOTOOLCHAIN)" = local
          test "$(go env GOVERSION)" = "go1.27.1"
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: go test -run=^$ -bench=. ./integrationtests/self
