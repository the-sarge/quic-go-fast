name: Windows transport close diagnostic

on:
  push:
    branches: [codex/windows-transport-close-diagnosis]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  TIMESCALE_FACTOR: 3

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.3
          check-latest: false
      - name: Record source and toolchain
        id: toolchain
        run: |
          {
            git rev-parse HEAD
            go version
            go env GOOS GOARCH GOTOOLCHAIN GOVERSION
          } | tee diagnostic-identity.log
          test "$(go env GOTOOLCHAIN)" = local
          test "$(go env GOVERSION)" = go1.27.3
      - name: Run 100 focused repetitions
        run: go test -v -count=100 -timeout=2m -run '^TestServerTransportClose$' ./integrationtests/self -version=1 2>&1 | tee diagnostic-focused.log
      - name: Replay the failed suite order once
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: go test -v -count=1 -timeout=5m -shuffle=1793335036702220400 ./integrationtests/self -version=1 2>&1 | tee diagnostic-seeded-suite.log
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-transport-close-${{ github.sha }}
          path: diagnostic-*.log
          if-no-files-found: warn
          retention-days: 14
