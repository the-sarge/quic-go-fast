on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: read-all

# Keep every command on the toolchain installed by setup-go.
env:
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: false
      - name: Verify selected Go toolchain
        shell: bash
        run: |
          go version
          test "$(go env GOTOOLCHAIN)" = local
          test "$(go env GOVERSION)" = "go1.27.1"
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
