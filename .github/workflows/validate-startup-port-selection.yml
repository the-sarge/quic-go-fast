name: Bounded Windows startup port validation

on:
  push:
    branches: [codex/windows-startup-port-selection]

permissions: read-all

env:
  GOTOOLCHAIN: local
  TIMESCALE_FACTOR: 10

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[validate-startup-ports]')
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          check-latest: false
      - name: Record pinned environment and current port ranges
        run: |
          mkdir -p "$RUNNER_TEMP/startup-ports"
          {
            git rev-parse HEAD
            go version
            test "$(go env GOTOOLCHAIN)" = local
            test "$(go env GOVERSION)" = go1.26.10
            python3 -c 'import os, platform; print(platform.platform()); print(platform.machine()); print("ImageOS=" + os.getenv("ImageOS", "")); print("ImageVersion=" + os.getenv("ImageVersion", ""))'
            netsh interface ipv4 show dynamicportrange protocol=tcp
            netsh interface ipv4 show dynamicportrange protocol=udp
            netsh interface ipv4 show excludedportrange protocol=tcp
            netsh interface ipv4 show excludedportrange protocol=udp
          } | tee "$RUNNER_TEMP/startup-ports/environment.txt"
      - name: Focused fixture, at most 100 executions
        timeout-minutes: 5
        env:
          QUIC_GO_HTTP_CAPTURE_DIR: ${{ runner.temp }}/startup-ports/focused
        run: python3 .github/scripts/http-capture.py --label startup-ports-focused run -- go test -v -count=100 -failfast -timeout=60s -run '^TestListenAndServeTLSStartupFailureReleasesUDP$' ./http3
      - name: Combined lifecycle tests, once
        timeout-minutes: 2
        env:
          QUIC_GO_HTTP_CAPTURE_DIR: ${{ runner.temp }}/startup-ports/combined
        run: python3 .github/scripts/http-capture.py --label startup-ports-combined run -- go test -v -count=1 -timeout=2m -run '^TestListenAndServeTLS' ./http3
      - name: Captured HTTP3 shuffle seed, once
        timeout-minutes: 5
        env:
          QUIC_GO_HTTP_CAPTURE_DIR: ${{ runner.temp }}/startup-ports/shuffle
        run: python3 .github/scripts/http-capture.py --label startup-ports-shuffle run -- go test -v -count=1 -shuffle=1792740625500411700 -cover -coverprofile=coverage-http3.txt -timeout=5m ./http3
      - name: Finalize retained evidence
        if: always()
        run: |
          for stage in focused combined shuffle; do
            QUIC_GO_HTTP_CAPTURE_DIR="$RUNNER_TEMP/startup-ports/$stage" python3 .github/scripts/http-capture.py finalize
          done
      - name: Retain bounded validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-ports-windows-go1.26.10
          path: ${{ runner.temp }}/startup-ports/
          if-no-files-found: warn
          retention-days: 14
